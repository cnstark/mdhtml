name: Release

# 推送 vX.Y.Z tag 后自动运行测试、构建 skill 压缩包和 VSCode 扩展，并发布 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验版本 tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "错误：tag 必须形如 v1.2.3，当前为 $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: 运行测试
        run: |
          set -euo pipefail
          for test_file in tests/*.js; do
            echo "运行测试：$test_file"
            node "$test_file"
          done

      - name: 构建并校验示例
        run: |
          set -euo pipefail
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$check_dir"' EXIT
          for example in examples/*.md; do
            output="$check_dir/$(basename "$example").html"
            ./mdhtml build "$example" --embed-images -o "$output"
            ./mdhtml check "$output"
          done

      - name: 打包发布产物
        run: |
          set -euo pipefail
          # 与 scripts/release.sh 保持一致：先同步 vscode/ 下的模板和 viewer 副本。
          cp template.html vscode/template.html
          cp vendor/viewer-static.min.js vscode/viewer-static.min.js
          rm -rf dist/mdhtml
          mkdir -p dist/mdhtml
          cp skills/mdhtml/SKILL.md mdhtml template.html README.md dist/mdhtml/
          cp -R vendor examples dist/mdhtml/
          find dist/mdhtml/examples -type f -name '*.md.html' -delete
          tar -czf "dist/mdhtml-skill-v$VERSION.tar.gz" -C dist mdhtml
          scripts/package-vsix.sh "$VERSION" "dist/mdhtml-vscode-v$VERSION.vsix"
          sha256sum "dist/mdhtml-skill-v$VERSION.tar.gz" "dist/mdhtml-vscode-v$VERSION.vsix"

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=("dist/mdhtml-skill-v$VERSION.tar.gz" "dist/mdhtml-vscode-v$VERSION.vsix")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes --title "$GITHUB_REF_NAME"
          fi
