  if (searchBox.classList.contains("open")) searchSource();
  // 高亮层是用户实际看到的文字（textarea 透明），必须同步更新，否则光标先动字符后到；
  // 实测 30 万字 tokenize 约 10ms，同步开销可接受。预览渲染开销大，仍走防抖。
  updateHighlight();
  clearTimeout(editTimer);
  const length = sourceEditor.value.length;
  const delay = length > EDIT_PREVIEW_DEBOUNCE.longAbove ? EDIT_PREVIEW_DEBOUNCE.longMs
    : length >= EDIT_PREVIEW_DEBOUNCE.mediumFrom ? EDIT_PREVIEW_DEBOUNCE.mediumMs
    : EDIT_PREVIEW_DEBOUNCE.shortMs;
  editTimer = setTimeout(() => { renderMarkdown(sourceEditor.value, preview); }, delay);
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && mobileOutline.matches && document.body.classList.contains("outline-open")) { event.preventDefault(); closeMobileOutline(); outlineToggle.focus(); return; }
  if (event.key === "Escape" && notePopover.style.display === "block") { event.preventDefault(); closeNotePopover(); return; }
  if (event.key === "Escape" && noteForm.style.display === "block") { event.preventDefault(); closeNoteForm(); return; }
  if (event.key === "Escape" && searchBox.classList.contains("open")) { event.preventDefault(); closeSearch(); return; }
  if (!(event.metaKey || event.ctrlKey)) return;
  const key = event.key.toLowerCase();
  if (key === "f") { event.preventDefault(); openSearch(); return; }
  if (key === "e" && !vscodeHost) { event.preventDefault(); setEditing(!document.body.classList.contains("editing")); }
  if (key === "s" && !vscodeHost) { event.preventDefault(); saveDocument(); }
});
window.addEventListener("scroll", updateOutline, {passive:true});
window.addEventListener("beforeunload", event => {
  if (!document.body.classList.contains("dirty")) return;
  event.preventDefault();
  event.returnValue = "";
});
syncAnnotationsFromMarkdown(markdown);
if (migratedAnnotations && !invalidAnnotationBlock) {
  try {
    const oldNotes = JSON.parse(legacyAnnotationBlock.textContent);
    if (!Array.isArray(oldNotes)) throw new Error("旧批注数据不是数组");
    if (!ANNOTATION_COMMENT.test(markdown)) {
      annotations = oldNotes.map(normalizeAnnotation);
      syncMarkdownFromAnnotations();
    }
    setStatus("批注已迁移到文档末尾注释块");
  } catch (_) { setStatus("旧批注块无法解析；原文件仍保留，请检查。", true); }
}
updateSaveState();
renderView();
restoreHandle();
</script>
</body>
